name: Supabase Otomatik Istek

on:
  schedule:
    - cron: '0 0 * * *' # Her gün gece 00:00'da otomatik çalışır
  workflow_dispatch: # Bizim elle test etmemizi sağlar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase'e Sinyal Gönder
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
